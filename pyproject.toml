[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-sim"
version = "0.1.0"
description = "MuJoCo simulation of the EI Robotics Challenge course"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# camera visualization (examples/view_camera.py)
viz = ["opencv-python>=4.8"]

[tool.setuptools.packages.find]
include = ["challenge*"]

[tool.setuptools.package-data]
challenge = ["assets/*.xml"]
